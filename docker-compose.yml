services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: alumni
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/alumni
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PHANTOMBUSTER_API_KEY: ${PHANTOMBUSTER_API_KEY:-}
      PHANTOMBUSTER_AGENT_ID: ${PHANTOMBUSTER_AGENT_ID:-}
      LINKEDIN_SESSION_COOKIE: ${LINKEDIN_SESSION_COOKIE:-}
      PHANTOMBUSTER_MOCK: ${PHANTOMBUSTER_MOCK:-true}

volumes:
  pgdata:
